name: Release

# Push a tag like v0.3.0 -> signed APK attached to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/signing/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing/keystore.properties"
          echo "COLORSTRUCTION_KEYSTORE_PROPERTIES=$RUNNER_TEMP/signing/keystore.properties" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew testDebugUnitTest assembleRelease -PappVersion="$VERSION" --console=plain
          cp app/build/outputs/apk/release/app-release.apk "ColorStruction-$GITHUB_REF_NAME.apk"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "ColorStruction-$GITHUB_REF_NAME.apk" | grep -i "SHA-256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hand-written notes in .github/release-notes/<tag>.md win; otherwise GitHub generates them.
          NOTES=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "ColorStruction-$GITHUB_REF_NAME.apk" \
            --title "ColorStruction $GITHUB_REF_NAME" "${NOTES_ARGS[@]}"

      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
